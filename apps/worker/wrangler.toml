name = "kedah-community-connect-api"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
APP_ENV = "development"
CORS_ORIGIN = "http://localhost:5173"

# Local D1 database binding (replace database_id with your Cloudflare D1 ID before deploying)
[[d1_databases]]
binding = "DB"
database_name = "kedah-community-connect-db"
database_id = "378bce08-faea-4a63-b758-e1317780b8fc"
migrations_dir = "../../migrations"

# R2 bucket binding (uncomment once R2 is enabled in Cloudflare Dashboard)
# [[r2_buckets]]
# binding = "REPORT_FILES"
# bucket_name = "kedah-community-connect-files"

# Production environment overrides
[env.production.vars]
APP_ENV = "production"
CORS_ORIGIN = "https://kedah-community-connect.pages.dev"
